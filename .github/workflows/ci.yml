name: CI

on:
    push:
        branches: ['**']
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14
            - name: Validate release tag
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  node --input-type=module <<'JS'
                  import { readFileSync } from 'node:fs';
                  const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
                  if (process.env.GITHUB_REF_NAME !== 'v' + version || !/^\d+\.\d+\.\d+$/.test(version)) {
                      throw new Error('Tag must match the stable package.json version');
                  }
                  JS
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run check
            - run: bun run test
            - run: bunx playwright install --with-deps chromium webkit
            - run: bun run test:browser
            - run: bun run build
            - run: bun run prepack
            - name: Pack release artifact
              id: pack
              run: |
                  mkdir -p package-artifact
                  npm pack --ignore-scripts --json --pack-destination package-artifact > package-artifact/pack.json
                  node --input-type=module <<'JS'
                  import { readFileSync, appendFileSync } from 'node:fs';
                  const [pack] = JSON.parse(readFileSync('package-artifact/pack.json', 'utf8'));
                  appendFileSync(process.env.GITHUB_OUTPUT, 'tarball=package-artifact/' + pack.filename + '\n');
                  JS
            - name: Test packed browser and SSR consumer
              run: bun run test:package
              env:
                  PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: npm-package
                  path: package-artifact/
                  if-no-files-found: error
                  retention-days: 14
