name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: read

concurrency:
    group: npm-release
    cancel-in-progress: false

jobs:
    verify:
        uses: ./.github/workflows/ci.yml

    publish:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: npm-package
                  path: package-artifact
            - name: Verify artifact identity and npm CLI
              run: |
                  node --input-type=module <<'JS'
                  import { readFileSync } from 'node:fs';
                  import { createHash } from 'node:crypto';
                  import { execFileSync } from 'node:child_process';
                  const [pack] = JSON.parse(readFileSync('package-artifact/pack.json', 'utf8'));
                  if (pack.name !== 'sileo-svelte' || 'v' + pack.version !== process.env.GITHUB_REF_NAME) {
                      throw new Error('Artifact does not match the release tag');
                  }
                  if (pack.filename !== 'sileo-svelte-' + pack.version + '.tgz') throw new Error('Unexpected artifact name');
                  const bytes = readFileSync('package-artifact/' + pack.filename);
                  const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64');
                  if (integrity !== pack.integrity) throw new Error('Artifact integrity mismatch');
                  const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
                  if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
                      throw new Error('Trusted publishing requires npm 11.5.1 or newer');
                  }
                  JS
            - name: Publish tested tarball
              run: npm publish package-artifact/*.tgz --ignore-scripts --provenance --access public
            - name: Verify published bytes
              run: |
                  node --input-type=module <<'JS'
                  import { readFileSync } from 'node:fs';
                  import { setTimeout } from 'node:timers/promises';
                  const [pack] = JSON.parse(readFileSync('package-artifact/pack.json', 'utf8'));
                  for (let attempt = 0; attempt < 6; attempt++) {
                      const response = await fetch('https://registry.npmjs.org/sileo-svelte/' + pack.version);
                      if (response.ok) {
                          const published = await response.json();
                          if (published.dist.integrity !== pack.integrity) throw new Error('Published bytes differ from tested artifact');
                          console.log('Verified sileo-svelte@' + pack.version);
                          process.exit(0);
                      }
                      if (response.status !== 404) throw new Error('Registry returned ' + response.status);
                      await setTimeout(10000);
                  }
                  throw new Error('Published version did not appear in the registry');
                  JS
